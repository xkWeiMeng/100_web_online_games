<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman with Category Hints</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #e0e0e0; }
.container { max-width: 600px; width: 95%; text-align: center; padding: 20px; }
h1 { font-size: 2rem; margin-bottom: 10px; background: linear-gradient(90deg, #e94560, #f5a623); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.screen { display: none; }
.screen.active { display: block; }
#start-screen p { margin: 15px 0; line-height: 1.6; color: #aaa; }
.btn { background: linear-gradient(135deg, #e94560, #c23152); border: none; color: #fff; padding: 14px 40px; font-size: 1.1rem; border-radius: 30px; cursor: pointer; margin-top: 20px; transition: transform .2s, box-shadow .2s; }
.btn:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(233,69,96,.4); }
.category { font-size: 1rem; color: #f5a623; margin: 10px 0; font-weight: 600; }
.hint-text { font-size: .85rem; color: #8ab4f8; margin-bottom: 15px; }
.word { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
.letter-slot { width: 36px; height: 44px; border-bottom: 3px solid #e94560; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: #fff; }
.hangman-svg { margin: 15px auto; }
.hangman-svg line, .hangman-svg circle { stroke: #e0e0e0; stroke-width: 3; stroke-linecap: round; fill: none; }
.hangman-svg .hidden { display: none; }
.keyboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 20px; }
.key { width: 36px; height: 40px; border: none; border-radius: 6px; background: #2a2a4a; color: #e0e0e0; font-size: .9rem; font-weight: 600; cursor: pointer; transition: background .2s, transform .1s; }
.key:hover:not(:disabled) { background: #3a3a6a; transform: scale(1.1); }
.key:disabled { opacity: .3; cursor: default; }
.key.correct { background: #27ae60; color: #fff; }
.key.wrong { background: #c0392b; color: #fff; }
.score-bar { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: .9rem; color: #aaa; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal-content { background: #1e1e3a; padding: 30px; border-radius: 16px; text-align: center; max-width: 350px; width: 90%; }
.modal-content h2 { font-size: 1.5rem; margin-bottom: 10px; }
.modal-content .reveal { color: #f5a623; font-size: 1.2rem; margin: 10px 0; }
.modal.hidden { display: none; }
.win h2 { color: #27ae60; }
.lose h2 { color: #e94560; }
</style>
</head>
<body>
<div class="container">
  <div id="start-screen" class="screen active">
    <h1>Hangman</h1>
    <p><strong>How to play:</strong><br>Guess the hidden word one letter at a time. You get a category hint and an extra clue to help. You have 6 wrong guesses before the hangman is complete!</p>
    <p>Score +10 per correct letter, +20 bonus for solving the word. Lose 5 per wrong guess.</p>
    <button class="btn" onclick="startGame()">Play</button>
  </div>
  <div id="game-screen" class="screen">
    <div class="score-bar"><span id="score-display">Score: 0</span><span id="streak-display">Streak: 0</span><span id="wrong-display">Wrong: 0/6</span></div>
    <svg class="hangman-svg" width="160" height="160" viewBox="0 0 160 160">
      <line x1="20" y1="150" x2="80" y2="150"/>
      <line x1="50" y1="150" x2="50" y2="20"/>
      <line x1="50" y1="20" x2="110" y2="20"/>
      <line x1="110" y1="20" x2="110" y2="40"/>
      <circle id="h-head" class="hidden" cx="110" cy="55" r="15"/>
      <line id="h-body" class="hidden" x1="110" y1="70" x2="110" y2="105"/>
      <line id="h-larm" class="hidden" x1="110" y1="80" x2="90" y2="95"/>
      <line id="h-rarm" class="hidden" x1="110" y1="80" x2="130" y2="95"/>
      <line id="h-lleg" class="hidden" x1="110" y1="105" x2="90" y2="130"/>
      <line id="h-rleg" class="hidden" x1="110" y1="105" x2="130" y2="130"/>
    </svg>
    <div class="category" id="category"></div>
    <div class="hint-text" id="hint"></div>
    <div class="word" id="word"></div>
    <div class="keyboard" id="keyboard"></div>
  </div>
  <div class="modal hidden" id="modal">
    <div class="modal-content" id="modal-content">
      <h2 id="modal-title"></h2>
      <p class="reveal" id="modal-word"></p>
      <button class="btn" onclick="nextWord()">Next Word</button>
    </div>
  </div>
</div>
<script>
const WORDS = [
  {word:"ELEPHANT",category:"Animals",hint:"Largest land mammal"},
  {word:"GUITAR",category:"Music",hint:"Six-stringed instrument"},
  {word:"JUPITER",category:"Space",hint:"Largest planet in our solar system"},
  {word:"PYTHON",category:"Programming",hint:"Named after a comedy group"},
  {word:"VOLCANO",category:"Geography",hint:"Mountain that erupts"},
  {word:"DIAMOND",category:"Gems",hint:"Hardest natural substance"},
  {word:"OXYGEN",category:"Science",hint:"We breathe this to survive"},
  {word:"BALLET",category:"Dance",hint:"Classical dance on pointed shoes"},
  {word:"SPHINX",category:"History",hint:"Guardian of the pyramids"},
  {word:"TSUNAMI",category:"Nature",hint:"Giant ocean wave"},
  {word:"BROCCOLI",category:"Food",hint:"Green tree-shaped vegetable"},
  {word:"Mozart",category:"Music",hint:"Child prodigy composer from Austria"},
  {word:"TORNADO",category:"Weather",hint:"Funnel-shaped wind storm"},
  {word:"PENGUIN",category:"Animals",hint:"Flightless bird that loves cold"},
  {word:"QUANTUM",category:"Science",hint:"Physics of the very small"},
  {word:"SAHARA",category:"Geography",hint:"Largest hot desert"},
  {word:"ORIGAMI",category:"Art",hint:"Japanese paper folding"},
  {word:"ESPRESSO",category:"Food",hint:"Concentrated coffee shot"},
  {word:"NEPTUNE",category:"Space",hint:"Farthest planet from the sun"},
  {word:"CELLO",category:"Music",hint:"Large bowed string instrument"},
  {word:"ALGORITHM",category:"Programming",hint:"Step-by-step problem solving"},
  {word:"CHAMELEON",category:"Animals",hint:"Color-changing reptile"},
  {word:"FIBONACCI",category:"Math",hint:"Famous number sequence"},
  {word:"AURORA",category:"Nature",hint:"Northern lights"},
  {word:"SAMURAI",category:"History",hint:"Japanese warrior class"},
  {word:"PHOTON",category:"Science",hint:"Particle of light"},
  {word:"KAYAK",category:"Sports",hint:"Palindrome boat"},
  {word:"MERCURY",category:"Space",hint:"Closest planet to the sun"},
  {word:"WASABI",category:"Food",hint:"Spicy green Japanese condiment"},
  {word:"HIEROGLYPH",category:"History",hint:"Ancient Egyptian writing symbol"},
];

const PARTS = ['h-head','h-body','h-larm','h-rarm','h-lleg','h-rleg'];
let score=0, streak=0, wrong=0, currentWord='', guessed=new Set(), used=[], gameActive=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let wordQueue=[...Array(WORDS.length).keys()];shuffle(wordQueue);let qi=0;

function startGame(){
  document.getElementById('start-screen').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');
  score=0;streak=0;qi=0;shuffle(wordQueue);
  loadWord();
}

function loadWord(){
  if(qi>=wordQueue.length){qi=0;shuffle(wordQueue);}
  const entry=WORDS[wordQueue[qi++]];
  currentWord=entry.word.toUpperCase();
  document.getElementById('category').textContent='Category: '+entry.category;
  document.getElementById('hint').textContent='Hint: '+entry.hint;
  wrong=0;guessed.clear();gameActive=true;
  PARTS.forEach(p=>document.getElementById(p).classList.add('hidden'));
  renderWord();renderKeyboard();updateUI();
}

function renderWord(){
  const el=document.getElementById('word');
  el.innerHTML=currentWord.split('').map(c=>`<div class="letter-slot">${guessed.has(c)?c:''}</div>`).join('');
}

function renderKeyboard(){
  const el=document.getElementById('keyboard');
  el.innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>`<button class="key" data-l="${c}" onclick="guess('${c}')">${c}</button>`).join('');
}

function guess(l){
  if(!gameActive||guessed.has(l))return;
  guessed.add(l);
  const btn=document.querySelector(`.key[data-l="${l}"]`);
  if(currentWord.includes(l)){
    btn.classList.add('correct');btn.disabled=true;
    score+=10;
    renderWord();
    if(currentWord.split('').every(c=>guessed.has(c))){
      score+=20;streak++;gameActive=false;showModal(true);
    }
  } else {
    btn.classList.add('wrong');btn.disabled=true;
    score=Math.max(0,score-5);wrong++;
    document.getElementById(PARTS[wrong-1]).classList.remove('hidden');
    if(wrong>=6){streak=0;gameActive=false;showModal(false);}
  }
  updateUI();
}

function updateUI(){
  document.getElementById('score-display').textContent='Score: '+score;
  document.getElementById('streak-display').textContent='Streak: '+streak;
  document.getElementById('wrong-display').textContent='Wrong: '+wrong+'/6';
}

function showModal(win){
  const m=document.getElementById('modal');
  const mc=document.getElementById('modal-content');
  mc.className='modal-content '+(win?'win':'lose');
  document.getElementById('modal-title').textContent=win?'You got it!':'Game Over';
  document.getElementById('modal-word').textContent='The word was: '+currentWord;
  m.classList.remove('hidden');
}

function nextWord(){
  document.getElementById('modal').classList.add('hidden');
  loadWord();
}

document.addEventListener('keydown',e=>{
  const k=e.key.toUpperCase();
  if(k.length===1&&k>='A'&&k<='Z')guess(k);
});
</script>
</body>
</html>
