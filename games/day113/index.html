<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Whack-a-Mole</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#4a7c59;font-family:'Segoe UI',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#game-container{width:min(100vw,480px);text-align:center;padding:12px}
h1{font-size:2rem;color:#fff;text-shadow:2px 2px 0 #2d4a35;margin-bottom:4px}
#hud{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:1.1rem;font-weight:700;padding:4px 8px;margin-bottom:8px}
#combo-display{color:#ffe066;font-size:.95rem;min-height:1.4em}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:400px;margin:0 auto}
.hole{position:relative;width:100%;aspect-ratio:1;background:radial-gradient(ellipse at 50% 80%,#3b2a1a 0%,#5c3d1e 60%,#4a7c59 100%);border-radius:50%;overflow:hidden;cursor:pointer}
.hole::after{content:'';position:absolute;bottom:0;left:5%;width:90%;height:35%;background:radial-gradient(ellipse,#2a1a0a,#3b2a1a);border-radius:50%;z-index:2}
.mole{position:absolute;bottom:-60%;left:50%;transform:translateX(-50%);width:70%;height:70%;transition:bottom .15s ease-out;z-index:1}
.mole-body{width:100%;height:100%;background:radial-gradient(circle at 40% 35%,#b08060,#7a5030);border-radius:50% 50% 40% 40%;position:relative}
.mole-body::before,.mole-body::after{content:'';position:absolute;width:22%;height:22%;background:#fff;border-radius:50%;top:25%}
.mole-body::before{left:20%;box-shadow:inset 4px 0 0 #222}
.mole-body::after{right:20%;box-shadow:inset 4px 0 0 #222}
.nose{position:absolute;width:18%;height:14%;background:#e87;border-radius:50%;top:48%;left:41%}
.hole.active .mole{bottom:20%}
.hole.whacked .mole{bottom:20%}
.hole.whacked .mole-body{background:radial-gradient(circle at 40% 35%,#d4a070,#a07040)}
.whack-effect{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-size:1.6rem;font-weight:900;color:#ffe066;z-index:10;animation:popUp .5s ease-out forwards;pointer-events:none;text-shadow:1px 1px 0 #a33}
@keyframes popUp{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-40px) scale(1.4)}}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;justify-content:center;align-items:center;z-index:100}
#panel{background:#fff;border-radius:16px;padding:32px;max-width:360px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.4)}
#panel h2{font-size:1.6rem;color:#2d4a35;margin-bottom:12px}
#panel p{color:#555;margin-bottom:16px;line-height:1.5}
#panel .score-line{font-size:1.3rem;font-weight:700;color:#b44;margin-bottom:8px}
button{background:#4a7c59;color:#fff;border:none;padding:12px 32px;font-size:1.1rem;font-weight:700;border-radius:8px;cursor:pointer;transition:background .2s}
button:hover{background:#3b6348}
</style>
</head>
<body>
<div id="game-container">
<h1>🔨 Whack-a-Mole</h1>
<div id="hud">
<span>Score: <span id="score">0</span></span>
<span id="combo-display"></span>
<span>⏱ <span id="timer">30</span>s</span>
</div>
<div id="grid"></div>
</div>
<div id="overlay">
<div id="panel">
<h2>🔨 Whack-a-Mole</h2>
<p>Tap moles as they pop up!<br>Hit consecutive moles to build a <b>combo multiplier</b> for bonus points.<br>Miss one and the combo resets!</p>
<div id="final-score"></div>
<button id="start-btn">Start Game</button>
</div>
</div>
<script>
const grid=document.getElementById('grid'),scoreEl=document.getElementById('score'),timerEl=document.getElementById('timer'),comboEl=document.getElementById('combo-display'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),finalScore=document.getElementById('final-score'),startBtn=document.getElementById('start-btn');
let score=0,combo=0,maxCombo=0,timeLeft=30,gameInterval,moleTimer,running=false;
const HOLES=9;
for(let i=0;i<HOLES;i++){const h=document.createElement('div');h.className='hole';h.innerHTML='<div class="mole"><div class="mole-body"><div class="nose"></div></div></div>';h.addEventListener('pointerdown',()=>whack(h));grid.appendChild(h)}
const holes=[...document.querySelectorAll('.hole')];
function whack(h){if(!running||!h.classList.contains('active'))return;h.classList.remove('active');h.classList.add('whacked');combo++;if(combo>maxCombo)maxCombo=combo;const mult=Math.floor(1+combo/3);const pts=10*mult;score+=pts;scoreEl.textContent=score;comboEl.textContent=combo>1?`Combo x${combo} (${mult}x)`:'';const fx=document.createElement('div');fx.className='whack-effect';fx.textContent=`+${pts}`;h.appendChild(fx);setTimeout(()=>{fx.remove();h.classList.remove('whacked')},500)}
function popMole(){if(!running)return;const inactive=holes.filter(h=>!h.classList.contains('active')&&!h.classList.contains('whacked'));if(!inactive.length)return;const h=inactive[Math.floor(Math.random()*inactive.length)];h.classList.add('active');const dur=Math.max(500,1200-score*2);setTimeout(()=>{if(h.classList.contains('active')){h.classList.remove('active');combo=0;comboEl.textContent=''}},dur)}
function scheduleMole(){if(!running)return;popMole();const delay=Math.max(300,800-score);moleTimer=setTimeout(scheduleMole,delay)}
function startGame(){score=0;combo=0;maxCombo=0;timeLeft=30;scoreEl.textContent=0;timerEl.textContent=30;comboEl.textContent='';overlay.style.display='none';running=true;holes.forEach(h=>{h.classList.remove('active','whacked')});gameInterval=setInterval(()=>{timeLeft--;timerEl.textContent=timeLeft;if(timeLeft<=0)endGame()},1000);scheduleMole()}
function endGame(){running=false;clearInterval(gameInterval);clearTimeout(moleTimer);holes.forEach(h=>h.classList.remove('active','whacked'));finalScore.innerHTML=`<div class="score-line">Final Score: ${score}</div><p style="margin:0;color:#666">Best Combo: x${maxCombo}</p>`;panel.querySelector('h2').textContent='Time\'s Up!';panel.querySelector('p').textContent='Great job! Play again?';startBtn.textContent='Play Again';overlay.style.display='flex'}
startBtn.addEventListener('click',startGame);
</script>
</body>
</html>
