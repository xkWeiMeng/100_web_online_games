<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sliding Puzzle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#app{text-align:center;width:100%;max-width:500px;padding:16px}
h1{font-size:1.8rem;margin-bottom:8px;background:linear-gradient(135deg,#38bdf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#94a3b8;font-size:.85rem;margin-bottom:16px}
#board{display:grid;gap:3px;margin:0 auto;border-radius:12px;overflow:hidden;background:#1e293b;padding:3px;touch-action:none;position:relative}
.tile{border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem;transition:transform .12s ease;user-select:none;background-size:cover;background-position:center;position:relative}
.tile:active{transform:scale(.95)}
.tile.empty{background:transparent!important;cursor:default;opacity:0}
.tile.correct{box-shadow:inset 0 0 0 2px #22c55e}
.controls{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .15s}
.btn-primary{background:#6366f1;color:#fff}.btn-primary:hover{background:#818cf8}
.btn-secondary{background:#334155;color:#e2e8f0}.btn-secondary:hover{background:#475569}
.stats{display:flex;gap:20px;justify-content:center;margin:10px 0;font-size:.95rem}
.stats span{color:#94a3b8}.stats b{color:#f8fafc}
#start-screen{position:absolute;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:20px}
#start-screen h1{font-size:2.2rem;margin-bottom:12px}
#start-screen p{color:#94a3b8;max-width:350px;line-height:1.5;margin-bottom:20px;font-size:.9rem}
.size-btns{display:flex;gap:10px;margin-bottom:16px}
.img-select{margin-bottom:16px}
.img-select label{display:block;color:#94a3b8;margin-bottom:6px;font-size:.85rem}
#preview{max-width:200px;max-height:200px;border-radius:10px;margin:10px auto;display:none;border:2px solid #334155}
#win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(4px)}
#win-box{background:#1e293b;padding:32px;border-radius:16px;text-align:center}
#win-box h2{font-size:1.6rem;color:#22c55e;margin-bottom:8px}
#win-box p{color:#94a3b8;margin-bottom:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="start-screen">
    <h1>Sliding Puzzle</h1>
    <p>Slide tiles to reconstruct the image. Click or tap a tile adjacent to the empty space to move it. Fewer moves = better score!</p>
    <div class="size-btns">
      <button class="btn btn-secondary size-btn" data-size="3">3×3</button>
      <button class="btn btn-primary size-btn" data-size="4">4×4</button>
      <button class="btn btn-secondary size-btn" data-size="5">5×5</button>
    </div>
    <div class="img-select">
      <label>Choose an image (or use default pattern)</label>
      <input type="file" id="img-input" accept="image/*" style="display:none">
      <button class="btn btn-secondary" onclick="document.getElementById('img-input').click()">Upload Image</button>
    </div>
    <img id="preview">
    <br>
    <button class="btn btn-primary" id="start-btn" style="font-size:1.1rem;padding:12px 36px">Start Game</button>
  </div>

  <div id="game-screen" class="hidden">
    <h1>Sliding Puzzle</h1>
    <div class="stats">
      <div><span>Moves: </span><b id="moves">0</b></div>
      <div><span>Time: </span><b id="timer">0:00</b></div>
    </div>
    <div id="board"></div>
    <div class="controls">
      <button class="btn btn-secondary" id="peek-btn">Peek</button>
      <button class="btn btn-secondary" id="shuffle-btn">Shuffle</button>
      <button class="btn btn-secondary" id="menu-btn">Menu</button>
    </div>
  </div>

  <div id="win-overlay">
    <div id="win-box">
      <h2>🎉 Solved!</h2>
      <p id="win-msg"></p>
      <button class="btn btn-primary" id="win-again">Play Again</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let size = 4, tiles = [], emptyIdx, moves, seconds, timerID, imgSrc = null, solved = false;

// Generate a gradient-based default image on canvas
function makeDefaultImage(sz) {
  const c = document.createElement('canvas'); c.width = c.height = sz;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,sz,sz);
  g.addColorStop(0,'#6366f1'); g.addColorStop(.5,'#ec4899'); g.addColorStop(1,'#f59e0b');
  ctx.fillStyle = g; ctx.fillRect(0,0,sz,sz);
  // draw circles
  for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(sz*.15+i*sz*.15,sz*.3+Math.sin(i)*sz*.2,sz*.08,0,Math.PI*2);ctx.fillStyle=`hsla(${i*60},80%,70%,.6)`;ctx.fill()}
  // draw text
  ctx.fillStyle='#fff';ctx.font=`bold ${sz*.12}px sans-serif`;ctx.textAlign='center';ctx.fillText('SLIDING',sz/2,sz*.55);ctx.fillText('PUZZLE',sz/2,sz*.7);
  return c.toDataURL();
}

function isSolvable(arr, n) {
  let inv = 0;
  const flat = arr.filter(v => v !== 0);
  for(let i=0;i<flat.length;i++) for(let j=i+1;j<flat.length;j++) if(flat[i]>flat[j]) inv++;
  if(n%2===1) return inv%2===0;
  const emptyRow = Math.floor(arr.indexOf(0)/n);
  return (inv + emptyRow) % 2 === 1;
}

function shuffle() {
  const n = size*size;
  do { tiles = Array.from({length:n},(_,i)=>i); for(let i=n-1;i>0;i--){const j=Math.random()*i|0;[tiles[i],tiles[j]]=[tiles[j],tiles[i]]} }
  while(!isSolvable(tiles,size) || tiles.every((v,i)=>v===i));
  emptyIdx = tiles.indexOf(0);
}

function render() {
  const board = $('#board');
  const w = Math.min(460, window.innerWidth - 40);
  const tileSize = (w - (size+1)*3) / size;
  board.style.width = board.style.height = w+'px';
  board.style.gridTemplateColumns = `repeat(${size},1fr)`;
  board.innerHTML = '';
  const imgSize = w - 6; // total image area
  tiles.forEach((val, idx) => {
    const div = document.createElement('div');
    div.className = 'tile' + (val===0?' empty':'') + (val===idx&&val!==0?' correct':'');
    if(val !== 0) {
      const col = (val % size), row = (val / size | 0);
      div.style.backgroundImage = `url(${imgSrc})`;
      div.style.backgroundSize = `${imgSize}px ${imgSize}px`;
      div.style.backgroundPosition = `-${col*(imgSize/size)}px -${row*(imgSize/size)}px`;
      div.innerHTML = `<span style="background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px;font-size:.7rem;position:absolute;top:4px;left:4px">${val}</span>`;
    }
    div.addEventListener('click', () => moveTile(idx));
    board.appendChild(div);
  });
}

function moveTile(idx) {
  if(solved) return;
  const r=idx/size|0, c=idx%size, er=emptyIdx/size|0, ec=emptyIdx%size;
  if((Math.abs(r-er)+Math.abs(c-ec))!==1) return;
  [tiles[idx],tiles[emptyIdx]]=[tiles[emptyIdx],tiles[idx]];
  emptyIdx=idx; moves++;
  $('#moves').textContent=moves;
  if(!timerID) timerID=setInterval(()=>{seconds++;$('#timer').textContent=`${seconds/60|0}:${('0'+seconds%60).slice(-2)}`},1000);
  render();
  if(tiles.every((v,i)=>v===i)) win();
}

function win() {
  solved=true; clearInterval(timerID);
  $('#win-msg').textContent=`Completed in ${moves} moves and ${seconds/60|0}m ${seconds%60}s`;
  $('#win-overlay').style.display='flex';
}

function startGame() {
  moves=0; seconds=0; solved=false; clearInterval(timerID); timerID=null;
  $('#moves').textContent='0'; $('#timer').textContent='0:00';
  if(!imgSrc) imgSrc = makeDefaultImage(600);
  shuffle(); render();
  $('#start-screen').classList.add('hidden');
  $('#game-screen').classList.remove('hidden');
  $('#win-overlay').style.display='none';
}

// Events
document.querySelectorAll('.size-btn').forEach(b => b.addEventListener('click', e => {
  document.querySelectorAll('.size-btn').forEach(x=>{x.className='btn btn-secondary size-btn'});
  e.target.className='btn btn-primary size-btn'; size=+e.target.dataset.size;
}));

$('#img-input').addEventListener('change', e => {
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=ev=>{imgSrc=ev.target.result;$('#preview').src=imgSrc;$('#preview').style.display='block'};r.readAsDataURL(f);
});

$('#start-btn').addEventListener('click', startGame);
$('#shuffle-btn').addEventListener('click', () => { if(!solved){shuffle();moves=0;seconds=0;clearInterval(timerID);timerID=null;$('#moves').textContent='0';$('#timer').textContent='0:00';render()}});
$('#menu-btn').addEventListener('click', () => { clearInterval(timerID);timerID=null;$('#game-screen').classList.add('hidden');$('#start-screen').classList.remove('hidden') });
$('#win-again').addEventListener('click', startGame);
$('#peek-btn').addEventListener('mousedown', () => { const b=$('#board');b.style.backgroundImage=`url(${imgSrc})`;b.style.backgroundSize='100%';document.querySelectorAll('.tile').forEach(t=>t.style.opacity='0') });
$('#peek-btn').addEventListener('mouseup', () => { const b=$('#board');b.style.backgroundImage='';document.querySelectorAll('.tile').forEach(t=>t.style.opacity='') });
$('#peek-btn').addEventListener('touchstart', e => { e.preventDefault();$('#peek-btn').dispatchEvent(new Event('mousedown')) });
$('#peek-btn').addEventListener('touchend', e => { e.preventDefault();$('#peek-btn').dispatchEvent(new Event('mouseup')) });

// Touch swipe on board
let tx,ty;
$('#board')?.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
</script>
</body>
</html>
