<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minesweeper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
h1 { font-size: 2rem; margin-bottom: 8px; background: linear-gradient(135deg, #e94560, #0f3460); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.screen { display: none; flex-direction: column; align-items: center; gap: 16px; max-width: 500px; width: 100%; }
.screen.active { display: flex; }
.instructions { background: #16213e; border-radius: 12px; padding: 16px; font-size: 0.9rem; line-height: 1.6; color: #aaa; }
.instructions b { color: #e94560; }
label { font-size: 0.9rem; color: #aaa; }
.settings { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; width: 100%; }
.settings div { display: flex; flex-direction: column; gap: 4px; }
input[type=range], input[type=number] { width: 100%; background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 6px; color: #eee; text-align: center; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
button { background: #e94560; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 1rem; cursor: pointer; transition: transform .1s, background .2s; }
button:hover { background: #c23152; }
button:active { transform: scale(0.95); }
button.secondary { background: #0f3460; }
.top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 8px 0; font-size: 1rem; }
.top-bar span { background: #16213e; padding: 6px 12px; border-radius: 8px; min-width: 60px; text-align: center; }
#board { display: grid; gap: 2px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.cell { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: clamp(0.7rem, 2.5vw, 1.1rem); border-radius: 4px; cursor: pointer; transition: background .1s; }
.cell.hidden { background: #2a4a7f; }
.cell.hidden:hover { background: #3a5a9f; }
.cell.revealed { background: #16213e; }
.cell.flagged { background: #2a4a7f; }
.cell.mine { background: #e94560; }
.c1 { color: #4fc3f7; } .c2 { color: #81c784; } .c3 { color: #e57373; }
.c4 { color: #9575cd; } .c5 { color: #ff8a65; } .c6 { color: #4dd0e1; }
.c7 { color: #f06292; } .c8 { color: #aaa; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 10; }
.overlay.active { display: flex; }
.overlay h2 { font-size: 2rem; }
.flag-toggle { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; font-size: 1.4rem; display: none; align-items: center; justify-content: center; z-index: 5; }
.flag-toggle.on { background: #ff9800; }
@media (pointer: coarse) { .flag-toggle { display: flex; } }
</style>
</head>
<body>

<div class="screen active" id="menu">
  <h1>💣 Minesweeper</h1>
  <div class="instructions">
    <b>How to play:</b> Reveal all cells without hitting a mine.<br>
    <b>Left click:</b> Reveal cell | <b>Right click / long press:</b> Flag<br>
    Numbers show adjacent mines. Flag all mines to win!
  </div>
  <div class="presets">
    <button onclick="preset(9,9,10)">Easy 9×9</button>
    <button onclick="preset(16,16,40)">Medium 16×16</button>
    <button onclick="preset(20,20,80)">Hard 20×20</button>
  </div>
  <div class="settings">
    <div><label>Rows</label><input type="number" id="rows" value="9" min="5" max="30"></div>
    <div><label>Cols</label><input type="number" id="cols" value="9" min="5" max="30"></div>
    <div><label>Mines</label><input type="number" id="mines" value="10" min="1" max="200"></div>
  </div>
  <button onclick="startGame()">Start Custom Game</button>
</div>

<div class="screen" id="game">
  <div class="top-bar">
    <span id="mineCount">💣 10</span>
    <span id="timer">⏱ 0s</span>
    <button class="secondary" onclick="backToMenu()">Menu</button>
  </div>
  <div id="board"></div>
</div>

<button class="flag-toggle" id="flagBtn" onclick="toggleFlag()">🚩</button>

<div class="overlay" id="overlay">
  <h2 id="endMsg"></h2>
  <p id="endSub"></p>
  <button onclick="startGame()">Play Again</button>
  <button class="secondary" onclick="backToMenu()">Menu</button>
</div>

<script>
let grid, rows, cols, mineCount, revealed, flagged, gameOver, firstClick, timerInterval, seconds, flagMode=false;

function preset(r,c,m){ document.getElementById('rows').value=r; document.getElementById('cols').value=c; document.getElementById('mines').value=m; startGame(); }

function startGame(){
  rows=Math.min(30,Math.max(5,+document.getElementById('rows').value));
  cols=Math.min(30,Math.max(5,+document.getElementById('cols').value));
  mineCount=Math.min(rows*cols-9,Math.max(1,+document.getElementById('mines').value));
  revealed=0; flagged=0; gameOver=false; firstClick=true; seconds=0;
  clearInterval(timerInterval);
  document.getElementById('timer').textContent='⏱ 0s';
  document.getElementById('mineCount').textContent='💣 '+mineCount;
  document.getElementById('menu').classList.remove('active');
  document.getElementById('game').classList.add('active');
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('flagBtn').style.display='';
  grid=Array.from({length:rows},()=>Array.from({length:cols},()=>({mine:false,revealed:false,flagged:false,count:0})));
  render();
}

function placeMines(sr,sc){
  let safe=new Set();
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let r=sr+dr,c=sc+dc;if(r>=0&&r<rows&&c>=0&&c<cols)safe.add(r*cols+c);}
  let placed=0;
  while(placed<mineCount){let i=Math.random()*rows*cols|0;if(safe.has(i)||grid[i/cols|0][i%cols].mine)continue;grid[i/cols|0][i%cols].mine=true;placed++;}
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(!grid[r][c].mine){let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let nr=r+dr,nc=c+dc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&grid[nr][nc].mine)cnt++;}grid[r][c].count=cnt;}
}

function render(){
  const board=document.getElementById('board');
  const size=Math.min((window.innerWidth-20)/cols,(window.innerHeight-140)/rows,40);
  board.style.gridTemplateColumns=`repeat(${cols},${size}px)`;
  board.innerHTML='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const cell=document.createElement('div');
    cell.className='cell hidden';
    cell.dataset.r=r;cell.dataset.c=c;
    cell.addEventListener('click',e=>onCell(r,c,flagMode));
    cell.addEventListener('contextmenu',e=>{e.preventDefault();onCell(r,c,true);});
    let longT;
    cell.addEventListener('touchstart',e=>{longT=setTimeout(()=>{e.preventDefault();onCell(r,c,true);longT=null;},400);},{passive:false});
    cell.addEventListener('touchend',()=>{if(longT){clearTimeout(longT);}});
    cell.addEventListener('touchmove',()=>{clearTimeout(longT);longT=null;});
    board.appendChild(cell);
  }
}

function getCell(r,c){return document.getElementById('board').children[r*cols+c];}

function onCell(r,c,flag){
  if(gameOver)return;
  const g=grid[r][c];
  if(flag){if(g.revealed)return;g.flagged=!g.flagged;flagged+=g.flagged?1:-1;document.getElementById('mineCount').textContent='💣 '+(mineCount-flagged);updateCell(r,c);return;}
  if(g.flagged||g.revealed)return;
  if(firstClick){firstClick=false;placeMines(r,c);timerInterval=setInterval(()=>{seconds++;document.getElementById('timer').textContent='⏱ '+seconds+'s';},1000);}
  reveal(r,c);
  if(g.mine){endGame(false);return;}
  checkWin();
}

function reveal(r,c){
  const g=grid[r][c];if(g.revealed||g.flagged)return;
  g.revealed=true;revealed++;updateCell(r,c);
  if(g.count===0&&!g.mine)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let nr=r+dr,nc=c+dc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols)reveal(nr,nc);}
}

function updateCell(r,c){
  const g=grid[r][c],el=getCell(r,c);
  if(g.flagged){el.className='cell flagged';el.textContent='🚩';return;}
  if(!g.revealed){el.className='cell hidden';el.textContent='';return;}
  if(g.mine){el.className='cell mine';el.textContent='💣';return;}
  el.className='cell revealed'+(g.count?' c'+g.count:'');
  el.textContent=g.count||'';
}

function checkWin(){if(revealed===rows*cols-mineCount)endGame(true);}

function endGame(won){
  gameOver=true;clearInterval(timerInterval);
  if(!won)for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(grid[r][c].mine){grid[r][c].revealed=true;updateCell(r,c);}
  document.getElementById('endMsg').textContent=won?'🎉 You Win!':'💥 Game Over';
  document.getElementById('endSub').textContent=won?`Cleared in ${seconds}s`:'Better luck next time!';
  document.getElementById('overlay').classList.add('active');
}

function backToMenu(){
  clearInterval(timerInterval);gameOver=true;
  document.getElementById('game').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('menu').classList.add('active');
  document.getElementById('flagBtn').style.display='none';
}

function toggleFlag(){flagMode=!flagMode;document.getElementById('flagBtn').classList.toggle('on',flagMode);}

window.addEventListener('resize',()=>{if(document.getElementById('game').classList.contains('active'))render();});
</script>
</body>
</html>
