<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--accent:#6366f1;--accent2:#818cf8;--text:#e2e8f0;--dim:#64748b;--err:#f87171;--ok:#34d399;--given:#94a3b8;--sel:#312e81;--rel:#1e1b4b;--font:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#app{text-align:center;width:100%;max-width:520px;padding:12px}
h1{font-size:2rem;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--dim);font-size:.85rem;margin-bottom:16px}
#title-screen{display:flex;flex-direction:column;align-items:center;gap:14px}
#title-screen p{max-width:400px;color:var(--dim);font-size:.9rem;line-height:1.5}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 28px;border-radius:8px;font-size:1rem;cursor:pointer;transition:.2s}
.btn:hover{background:var(--accent2);transform:scale(1.04)}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn-sm{padding:7px 16px;font-size:.85rem;border-radius:6px}
.btn-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn-outline.active{background:var(--accent);color:#fff}
#game-screen{display:none;flex-direction:column;align-items:center;gap:10px}
.top-bar{display:flex;justify-content:space-between;width:100%;max-width:414px;font-size:.85rem;color:var(--dim);padding:0 2px}
#board{display:grid;grid-template-columns:repeat(9,1fr);gap:0;border:2.5px solid var(--accent);border-radius:6px;overflow:hidden;width:100%;max-width:414px;aspect-ratio:1;user-select:none}
.cell{background:var(--card);display:flex;align-items:center;justify-content:center;font-size:clamp(1rem,4.5vw,1.6rem);cursor:pointer;border:1px solid var(--border);position:relative;transition:background .12s}
.cell.given{color:var(--given);font-weight:700;cursor:default}
.cell.user{color:var(--accent2);font-weight:600}
.cell.selected{background:var(--sel)}
.cell.related{background:var(--rel)}
.cell.error{color:var(--err)}
.cell.br-r{border-right:2.5px solid var(--accent)}
.cell.br-b{border-bottom:2.5px solid var(--accent)}
.cell .notes{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%;position:absolute;top:0;left:0;font-size:clamp(.45rem,1.8vw,.65rem);color:var(--dim);pointer-events:none}
.cell .notes span{display:flex;align-items:center;justify-content:center}
#numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:414px;margin-top:4px}
.numkey{background:var(--card);color:var(--text);border:1.5px solid var(--border);border-radius:8px;padding:12px 0;font-size:1.2rem;cursor:pointer;transition:.15s}
.numkey:hover{background:var(--accent);border-color:var(--accent)}
.numkey.active{background:var(--accent);border-color:var(--accent)}
.controls{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap;justify-content:center}
#msg{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#000;padding:12px 28px;border-radius:10px;font-weight:700;font-size:1.1rem;display:none;z-index:10;animation:pop .3s ease}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
</style>
</head>
<body>
<div id="app">
<div id="title-screen">
<h1>Sudoku</h1>
<p class="sub">Generator & Solver</p>
<p>Fill the 9×9 grid so every row, column, and 3×3 box contains the digits 1–9 exactly once. Select a cell and tap a number. Toggle Notes mode for pencil marks.</p>
<div class="btn-row">
<button class="btn btn-sm btn-outline active" data-d="easy">Easy</button>
<button class="btn btn-sm btn-outline" data-d="medium">Medium</button>
<button class="btn btn-sm btn-outline" data-d="hard">Hard</button>
</div>
<button class="btn" onclick="startGame()">Play</button>
</div>
<div id="game-screen">
<div class="top-bar"><span id="diff-label">Easy</span><span id="timer">00:00</span><span id="mistakes-label">Mistakes: 0/3</span></div>
<div id="board"></div>
<div id="numpad"></div>
<div class="controls">
<button class="btn btn-sm btn-outline" id="note-btn" onclick="toggleNotes()">Notes: Off</button>
<button class="btn btn-sm btn-outline" onclick="undo()">Undo</button>
<button class="btn btn-sm btn-outline" onclick="erase()">Erase</button>
<button class="btn btn-sm btn-outline" onclick="solveBoard()">Solve</button>
<button class="btn btn-sm btn-outline" onclick="showTitle()">New</button>
</div>
</div>
<div id="msg"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let board, solution, given, notes, sel, noteMode=false, mistakes, history=[], timerI, seconds;
const CLUES = {easy:42,medium:32,hard:24};
let diff='easy';

$$('[data-d]').forEach(b=>{b.onclick=()=>{$$('[data-d]').forEach(x=>x.classList.remove('active'));b.classList.add('active');diff=b.dataset.d}});

function showTitle(){clearInterval(timerI);$('#title-screen').style.display='flex';$('#game-screen').style.display='none'}
function startGame(){
  $('#title-screen').style.display='none';$('#game-screen').style.display='flex';
  $('#diff-label').textContent=diff[0].toUpperCase()+diff.slice(1);
  noteMode=false;$('#note-btn').textContent='Notes: Off';
  mistakes=0;seconds=0;history=[];sel=null;
  $('#mistakes-label').textContent='Mistakes: 0/3';$('#timer').textContent='00:00';
  clearInterval(timerI);timerI=setInterval(()=>{seconds++;$('#timer').textContent=`${String(seconds/60|0).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`},1000);
  generate();renderBoard();renderNumpad();
}

function generate(){
  solution=Array.from({length:81},()=>0);
  fillSudoku(solution);
  board=[...solution];given=Array(81).fill(false);notes=Array.from({length:81},()=>new Set());
  let indices=[...Array(81).keys()];shuffle(indices);
  let remove=81-CLUES[diff],removed=0;
  for(let i of indices){if(removed>=remove)break;let v=board[i];board[i]=0;
    if(countSolutions([...board],0)===1){removed++}else{board[i]=v}}
  for(let i=0;i<81;i++)if(board[i])given[i]=true;
}

function fillSudoku(b){
  let i=b.indexOf(0);if(i===-1)return true;
  let nums=[1,2,3,4,5,6,7,8,9];shuffle(nums);
  for(let n of nums){if(valid(b,i,n)){b[i]=n;if(fillSudoku(b))return true;b[i]=0}}return false;
}
function countSolutions(b,count){
  if(count>1)return count;let i=b.indexOf(0);if(i===-1)return count+1;
  for(let n=1;n<=9;n++){if(valid(b,i,n)){b[i]=n;count=countSolutions(b,count);b[i]=0;if(count>1)return count}}return count;
}
function valid(b,i,n){
  let r=i/9|0,c=i%9;
  for(let j=0;j<9;j++){if(b[r*9+j]===n||b[j*9+c]===n)return false}
  let br=r-r%3,bc=c-c%3;
  for(let dr=0;dr<3;dr++)for(let dc=0;dc<3;dc++)if(b[(br+dr)*9+bc+dc]===n)return false;
  return true;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}

function renderBoard(){
  let h='';for(let i=0;i<81;i++){
    let r=i/9|0,c=i%9,cls='cell';
    if(c%3===2&&c<8)cls+=' br-r';if(r%3===2&&r<8)cls+=' br-b';
    if(given[i])cls+=' given';else if(board[i])cls+=' user';
    if(sel!==null){let sr=sel/9|0,sc=sel%9;if(i===sel)cls+=' selected';
      else if(r===sr||c===sc||(r-r%3)===(sr-sr%3)&&(c-c%3)===(sc-sc%3))cls+=' related'}
    if(!given[i]&&board[i]&&board[i]!==solution[i])cls+=' error';
    let val=board[i]||'';
    let noteHtml='';
    if(!board[i]&&notes[i].size){noteHtml='<div class="notes">';for(let n=1;n<=9;n++)noteHtml+=`<span>${notes[i].has(n)?n:''}</span>`;noteHtml+='</div>';val=''}
    h+=`<div class="${cls}" data-i="${i}" onclick="selectCell(${i})">${val}${noteHtml}</div>`;
  }$('#board').innerHTML=h;
}
function renderNumpad(){
  let h='';for(let n=1;n<=9;n++)h+=`<div class="numkey" onclick="enterNum(${n})">${n}</div>`;
  h+=`<div class="numkey" onclick="erase()">✕</div>`;$('#numpad').innerHTML=h;
}
function selectCell(i){sel=i;renderBoard()}
function toggleNotes(){noteMode=!noteMode;$('#note-btn').textContent='Notes: '+(noteMode?'On':'Off');noteMode?$('#note-btn').classList.add('active'):$('#note-btn').classList.remove('active')}

function enterNum(n){
  if(sel===null||given[sel])return;
  history.push({i:sel,val:board[sel],notes:new Set(notes[sel])});
  if(noteMode){if(!board[sel]){notes[sel].has(n)?notes[sel].delete(n):notes[sel].add(n)}}
  else{
    notes[sel].clear();board[sel]=n;
    if(n!==solution[sel]){mistakes++;$('#mistakes-label').textContent=`Mistakes: ${mistakes}/3`;
      if(mistakes>=3){clearInterval(timerI);flash('Game Over!','#f87171');setTimeout(showTitle,2000);return}}
    // remove note from peers
    let r=sel/9|0,c=sel%9,br=r-r%3,bc=c-c%3;
    for(let j=0;j<9;j++){notes[r*9+j].delete(n);notes[j*9+c].delete(n)}
    for(let dr=0;dr<3;dr++)for(let dc=0;dc<3;dc++)notes[(br+dr)*9+bc+dc].delete(n);
    if(!board.includes(0)&&mistakes<3){clearInterval(timerI);flash(`Solved in ${$('#timer').textContent}!`,'#34d399')}
  }
  renderBoard();
}
function erase(){if(sel===null||given[sel])return;history.push({i:sel,val:board[sel],notes:new Set(notes[sel])});board[sel]=0;notes[sel].clear();renderBoard()}
function undo(){if(!history.length)return;let h=history.pop();board[h.i]=h.val;notes[h.i]=h.notes;sel=h.i;renderBoard()}

function solveBoard(){for(let i=0;i<81;i++){board[i]=solution[i];notes[i].clear()}clearInterval(timerI);renderBoard();flash('Solved!','var(--accent)')}

function flash(t,c){let m=$('#msg');m.textContent=t;m.style.background=c;m.style.display='block';setTimeout(()=>m.style.display='none',2500)}

document.addEventListener('keydown',e=>{
  if(sel===null)return;
  let n=+e.key;if(n>=1&&n<=9){enterNum(n);return}
  if(e.key==='Backspace'||e.key==='Delete'){erase();return}
  if(e.key==='n'){toggleNotes();return}
  if(e.key==='z'&&(e.ctrlKey||e.metaKey)){undo();e.preventDefault();return}
  let r=sel/9|0,c=sel%9;
  if(e.key==='ArrowUp'&&r>0)sel-=9;else if(e.key==='ArrowDown'&&r<8)sel+=9;
  else if(e.key==='ArrowLeft'&&c>0)sel--;else if(e.key==='ArrowRight'&&c<8)sel++;
  renderBoard();
});
</script>
</body>
</html>
