<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Says</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;font-family:'Segoe UI',system-ui,sans-serif;color:#eee;user-select:none}
h1{font-size:2.4rem;margin-bottom:.3rem;background:linear-gradient(135deg,#e94560,#0f3460);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#subtitle{font-size:.95rem;color:#888;margin-bottom:1.2rem}
#board{position:relative;width:320px;height:320px;border-radius:50%;overflow:hidden;box-shadow:0 0 60px rgba(233,69,96,.15)}
.pad{position:absolute;width:50%;height:50%;cursor:pointer;opacity:.55;transition:opacity .1s,filter .1s}
.pad.lit{opacity:1;filter:brightness(1.5)}
.pad:active{opacity:.9}
#p0{top:0;left:0;background:#e74c3c;border-radius:100% 0 0 0}
#p1{top:0;left:50%;background:#2ecc71;border-radius:0 100% 0 0}
#p2{bottom:0;left:0;background:#3498db;border-radius:0 0 0 100%}
#p3{bottom:0;left:50%;background:#f1c40f;border-radius:0 0 100% 0}
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100px;height:100px;border-radius:50%;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:2;border:4px solid #16213e}
#center span{font-size:1.6rem;font-weight:700}
#info{margin-top:1.4rem;text-align:center}
#score{font-size:1.1rem;margin-bottom:.6rem;color:#aaa}
#btn{padding:.65rem 2.2rem;font-size:1.05rem;border:none;border-radius:8px;background:linear-gradient(135deg,#e94560,#0f3460);color:#fff;cursor:pointer;font-weight:600;letter-spacing:.5px;transition:transform .15s}
#btn:hover{transform:scale(1.05)}
#btn:disabled{opacity:.4;cursor:default;transform:none}
#msg{margin-top:.7rem;font-size:.9rem;min-height:1.3rem;color:#ccc}
#best{margin-top:.4rem;font-size:.85rem;color:#666}
</style>
</head>
<body>
<h1>Simon Says</h1>
<p id="subtitle">Color Memory Game</p>
<div id="board">
  <div class="pad" id="p0" data-i="0"></div>
  <div class="pad" id="p1" data-i="1"></div>
  <div class="pad" id="p2" data-i="2"></div>
  <div class="pad" id="p3" data-i="3"></div>
  <div id="center"><span id="lvl">—</span></div>
</div>
<div id="info">
  <p id="score">Watch the pattern, then repeat it!</p>
  <button id="btn" onclick="startGame()">Start Game</button>
  <p id="msg"></p>
  <p id="best"></p>
</div>

<script>
const pads=document.querySelectorAll('.pad'),lvlEl=document.getElementById('lvl'),scoreEl=document.getElementById('score'),btn=document.getElementById('btn'),msgEl=document.getElementById('msg'),bestEl=document.getElementById('best');
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
const freqs=[261.63,329.63,392,523.25];
let seq=[],playerIdx=0,playing=false,best=+localStorage.getItem('simon_best')||0;
if(best)bestEl.textContent='Best: '+best;

function tone(i,dur=.25){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freqs[i];o.type='sine';g.gain.setValueAtTime(.18,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}

function light(i,dur=400){const p=document.getElementById('p'+i);p.classList.add('lit');tone(i,dur/1000);setTimeout(()=>p.classList.remove('lit'),dur)}

async function playSeq(){playing=true;btn.disabled=true;msgEl.textContent='Watch...';
for(let i=0;i<seq.length;i++){await new Promise(r=>setTimeout(r,450));light(seq[i],350)}
await new Promise(r=>setTimeout(r,400));playing=false;msgEl.textContent='Your turn!'}

function nextRound(){seq.push(Math.floor(Math.random()*4));playerIdx=0;lvlEl.textContent=seq.length;scoreEl.textContent='Round '+seq.length;playSeq()}

function gameOver(){playing=true;msgEl.textContent='Wrong! Game over.';btn.disabled=false;btn.textContent='Play Again';
if(seq.length-1>best){best=seq.length-1;localStorage.setItem('simon_best',best);bestEl.textContent='New Best: '+best+'!'}else if(best){bestEl.textContent='Best: '+best}
// flash all
for(let k=0;k<3;k++)setTimeout(()=>{pads.forEach((_,i)=>light(i,200))},k*300)}

function handlePad(i){if(playing)return;light(i,250);
if(seq[playerIdx]===i){playerIdx++;if(playerIdx===seq.length){playing=true;setTimeout(nextRound,800)}}else{gameOver()}}

pads.forEach(p=>{p.addEventListener('pointerdown',e=>{e.preventDefault();handlePad(+p.dataset.i)})});

function startGame(){audioCtx.resume();seq=[];playerIdx=0;playing=false;msgEl.textContent='';btn.disabled=true;btn.textContent='Start Game';nextRound()}
</script>
</body>
</html>
